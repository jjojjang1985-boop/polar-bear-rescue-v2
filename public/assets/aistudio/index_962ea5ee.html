<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>북극곰 구조대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  /* 노을빛 북극 만화 세계. 굵은 갈색 테두리 + 노란 제목 + 산호색 버튼. 한 화면 게임: 위 상태바 / 가운데 무대+빙하 탑 / 아래 대사 창 */
  --night:#2a5d9c;
  --deep:#1d4478;
  --ice:#e8f7ff;
  --aurora:#7be0c8;
  --coral:#f2735a;
  --sun:#ffe14d;
  --ink:#3b2414;
  --line:#4a2a12;
  --paper:#fffaf0;
  --ok:#2fbf71;
  --bad:#ef4f4f;
  --font-display:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,#b9a6e6 0%,#f4b8b0 45%,#ffd58a 100%);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-wrap:balance;margin:0}

#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:1320px;margin:0 auto}

/* 상단 바 */
#top{display:flex;align-items:center;gap:12px;padding:10px 16px}
#brand{font-family:var(--font-display);font-size:26px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;color:var(--sun);-webkit-text-stroke:6px var(--line);paint-order:stroke fill;text-shadow:0 3px 0 var(--line)}
#brand .dot{display:none}
#pips{display:flex;gap:6px;margin-left:8px}
.pip{font-family:var(--font-display);font-size:14px;padding:4px 12px;border-radius:999px;background:#fff;color:#9a8574;border:2.5px solid var(--line)}
.pip.on{background:var(--sun);color:var(--line)}
.pip.done{background:#c9f3e3;color:#1f6b4f}
#top .sp{flex:1}
.tbtn{border:2.5px solid var(--line);border-radius:999px;padding:6px 14px;font-family:var(--font-display);font-size:16px;background:#fff;color:var(--line);display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line)}
.tbtn:hover{background:#fff6d6}
#noteCount{background:var(--sun);color:#4a3400;border-radius:999px;padding:0 8px;font-size:14px}
#noteBtn.bump{animation:bump .5s}

/* 가운데 */
#main{display:grid;grid-template-columns:1fr 150px;gap:12px;padding:0 16px;min-height:0}
#stage{position:relative;border-radius:26px;overflow:hidden;min-height:0;border:4px solid var(--line);box-shadow:0 6px 0 var(--line),0 14px 30px rgba(74,42,18,.25)}
#bg{position:absolute;inset:0;transition:opacity .4s}
#bg svg{width:100%;height:100%;display:block}
#layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#stage.shake{animation:shake .4s}
.flash{position:absolute;inset:0;background:#cfefff;animation:flash .9s forwards}

.panel{background:rgba(255,252,244,.97);color:var(--ink);border-radius:26px;border:3.5px solid var(--line);box-shadow:0 6px 0 var(--line),0 16px 34px rgba(74,42,18,.3);padding:18px 22px;width:100%;max-width:820px;max-height:100%;overflow:auto;animation:pop .35s ease-out}
.panel h2{font-size:27px;color:var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel .tag{font-family:var(--font-display);font-size:14px;background:var(--coral);color:#fff;padding:3px 12px;border-radius:999px;border:2.5px solid var(--line)}
.panel .guide{margin:6px 0 14px;font-size:17px;color:#6b4a33;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}

.big{border:3px solid var(--line);border-radius:999px;padding:11px 26px;font-family:var(--font-display);font-size:21px;background:linear-gradient(180deg,#ff917a,#f0644a);color:#fff;box-shadow:0 5px 0 var(--line);transition:transform .08s;text-shadow:0 2px 0 rgba(74,42,18,.35)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.big.blue{background:linear-gradient(180deg,#7fd3ff,#3a9be6)}
.big.green{background:linear-gradient(180deg,#7be6b0,#2fbf71)}
.big.ghost{background:#fff;color:var(--line);text-shadow:none}
.big:disabled{opacity:.45;cursor:default}

.opt{border:2.5px solid var(--line);border-radius:16px;padding:12px 16px;font-size:18px;font-family:var(--font-body);font-weight:700;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);text-align:left;line-height:1.4;transition:transform .08s}
.opt:hover{transform:translateY(-2px);background:#fff8dc}
.opt.ok{background:#d4f7e3}
.opt.no{background:#ffdcdc;animation:wob .4s}
.opt:disabled{cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 대사 창 */
#dlg{margin:12px 16px 14px;display:grid;grid-template-columns:128px 1fr;gap:16px;align-items:center;background:#fffaf0;color:var(--ink);border-radius:28px;min-height:156px;padding:12px 20px 12px 12px;border:4px solid var(--line);box-shadow:0 6px 0 var(--line),0 14px 26px rgba(74,42,18,.25);cursor:pointer;position:relative;user-select:none}
#dlg.hidden{visibility:hidden}
#portrait{width:128px;height:128px;border-radius:28px;background:radial-gradient(circle at 40% 30%,#fffdf5,#ffe3b8);display:grid;place-items:center;overflow:hidden;border:3px solid var(--line)}
#portrait svg{width:118%;height:118%;margin-top:14%}
#portrait.talk svg{animation:talk .5s ease-out}
#who{font-family:var(--font-display);font-size:20px;color:var(--line);background:var(--sun);display:inline-block;padding:2px 16px;border-radius:999px;margin-bottom:6px;border:2.5px solid var(--line)}
#text{font-size:21px;line-height:1.65;min-height:3.3em;word-break:keep-all;font-weight:700}
#text .c{opacity:0}
#text .c.on{opacity:1}
#text.narr{font-weight:400;color:#7a5a43}
#next{position:absolute;right:18px;bottom:10px;font-family:var(--font-display);font-size:15px;color:var(--coral);opacity:0;transition:opacity .2s}
#dlg.ready #next{opacity:1;animation:nudge 1s infinite}
.kw{font:inherit;color:#0a4f9c;font-weight:700;background:linear-gradient(transparent 58%,#ffe27a 58%);border:0;border-bottom:3px dashed #f0a500;padding:0 2px;margin:0 1px;border-radius:4px;cursor:pointer;animation:glint 1.4s infinite}
.kw.got{animation:none;background:linear-gradient(transparent 58%,#bff0d6 58%);border-bottom:3px solid var(--ok);color:#13693d}
.kw.got::after{content:" ✓";font-size:.8em}
.hint-tip{position:absolute;right:20px;top:-18px;background:var(--sun);color:#4a3400;font-family:var(--font-display);padding:5px 12px;border-radius:12px;font-size:15px;animation:nudge 1s infinite}

/* 빙하 탑 */
#tower{position:relative;border-radius:26px;background:linear-gradient(180deg,#c3b2ee 0%,#f6c2b6 55%,#ffe0a6 100%);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px 8px 44px;border:4px solid var(--line);box-shadow:0 6px 0 var(--line)}
#tower.off{opacity:.35;filter:grayscale(.6)}
#tower h3{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:16px;color:var(--sun);-webkit-text-stroke:4px var(--line);paint-order:stroke fill}
#tcount{position:absolute;top:34px;left:0;right:0;text-align:center;font-family:var(--font-display);font-size:14px;color:var(--line)}
#poriTop{width:96px;height:96px;transition:transform .4s;margin-bottom:-6px;z-index:2}
#poriTop.wobble{animation:wob .5s 2}
#poriTop.happy{animation:hop .6s 2}
#blocks{display:flex;flex-direction:column-reverse;align-items:center;gap:4px}
.ice{width:112px;height:20px;border-radius:8px;background:linear-gradient(180deg,#ffffff 0%,#d9f2ff 40%,#9fd2f1 100%);border:2.5px solid #2c5a86;box-shadow:inset 0 -4px 0 rgba(60,130,190,.35),inset 0 2px 0 #fff;animation:drop .35s ease-out}
.ice:nth-child(even){width:100px}
.ice.melt{animation:melt .5s forwards}
#sea{position:absolute;left:0;right:0;bottom:0;height:44px;background:linear-gradient(180deg,#4fb0e8,#2a7cc4);border-top:3px solid #2c5a86}
#sea::before{content:"";position:absolute;left:-20%;right:-20%;top:-8px;height:16px;background:radial-gradient(circle at 10px 8px,#4fb0e8 9px,transparent 10px) 0 0/20px 16px repeat-x;animation:wave 3s linear infinite}

/* 오버레이 화면 */
.screen{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;background:linear-gradient(180deg,#a99be6 0%,#f2a9b4 40%,#ffc98a 72%,#ffe7a8 100%)}
.screen .aur{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.screen .aur i{position:absolute;width:140%;height:40%;left:-20%;border-radius:50%;filter:blur(40px);opacity:.5;animation:aur 12s ease-in-out infinite alternate}
.screen .scard{position:relative;max-width:920px;width:100%;text-align:center}
.logo{font-family:var(--font-display);font-size:clamp(48px,9vw,104px);color:var(--sun);-webkit-text-stroke:clamp(10px,1.6vw,18px) var(--line);paint-order:stroke fill;text-shadow:0 8px 0 var(--line);line-height:1.08;letter-spacing:1px;transform:rotate(-2deg)}
.logo .l2{display:block}
.pill{display:inline-block;font-family:var(--font-display);font-size:clamp(20px,2.6vw,30px);background:#fff;color:var(--line);border:4px solid var(--line);border-radius:999px;padding:6px 28px;margin-top:14px;box-shadow:0 5px 0 var(--line)}
.lineup{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:18px 0 14px;flex-wrap:nowrap}
.lineup .ch.hero{width:clamp(96px,15vw,190px)}
.lineup .ch{width:clamp(70px,11vw,140px);text-align:center;animation:float 3s ease-in-out infinite}
.lineup .ch:nth-child(2){animation-delay:.4s}.lineup .ch:nth-child(3){animation-delay:.8s}.lineup .ch:nth-child(4){animation-delay:1.2s}
.lineup .ch span{font-family:var(--font-display);font-size:16px;color:var(--line);background:#fff;border:2.5px solid var(--line);border-radius:999px;padding:1px 12px;display:inline-block;margin-top:-6px}
.sub{color:#5b3a22;font-size:18px;margin:6px 0 18px;font-weight:700}
.form{background:#fffaf0;color:var(--ink);border-radius:26px;padding:22px;max-width:660px;margin:0 auto;text-align:left;border:4px solid var(--line);box-shadow:0 6px 0 var(--line)}
.form label{font-family:var(--font-display);font-size:19px;display:block;margin:12px 0 6px;color:var(--line)}
.form input[type=text]{width:100%;font-size:20px;padding:12px 14px;border-radius:14px;border:3px solid var(--line);font-family:var(--font-body);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:17px;font-family:var(--font-display);color:var(--line);box-shadow:0 3px 0 var(--line)}
.chip.sel{background:var(--sun)}
.avs{display:flex;gap:12px}
.av{border:3px solid var(--line);border-radius:22px;background:radial-gradient(circle at 40% 30%,#fff,#ffe3b8);width:120px;height:120px;padding:0;overflow:hidden}
.av.sel{background:radial-gradient(circle at 40% 30%,#fff,#ffd25a);box-shadow:0 0 0 4px var(--coral)}
.av svg{width:120%;height:120%;margin:12% 0 0 -10%}

/* 작전 지도 */
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.node{border:3.5px solid var(--line);border-radius:24px;padding:16px;text-align:left;background:#fffaf0;color:var(--ink);box-shadow:0 6px 0 var(--line);min-height:150px;display:flex;flex-direction:column;gap:6px;position:relative}
.node .n{font-family:var(--font-display);font-size:14px;color:var(--line);background:var(--sun);border:2.5px solid var(--line);align-self:flex-start;padding:1px 12px;border-radius:999px}
.node h3{font-size:22px;color:var(--line)}
.node p{margin:0;font-size:15px;color:#7a5a43;line-height:1.4;font-weight:700}
.node .st{margin-top:auto;font-size:22px;color:#f0a500;letter-spacing:2px;-webkit-text-stroke:1px var(--line)}
.node.lock{filter:grayscale(.9);opacity:.6;cursor:not-allowed}
.node.lock::after{content:"잠김";position:absolute;right:14px;top:14px;font-family:var(--font-display);font-size:14px;background:#7a6a5e;color:#fff;padding:2px 10px;border-radius:999px}
.node.cur{background:#fff3c4;box-shadow:0 6px 0 var(--line),0 0 0 5px var(--coral);animation:float 2.4s ease-in-out infinite}
.teacher{background:none;border:0;color:#6b4a33;text-decoration:underline;margin-top:16px;font-size:14px;font-weight:700}
.lb{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:17px;font-variant-numeric:tabular-nums}
.lb td{background:#fff;padding:8px 12px;border-top:2.5px solid var(--line);border-bottom:2.5px solid var(--line)}
.lb td:first-child{border-left:2.5px solid var(--line);border-radius:14px 0 0 14px;font-family:var(--font-display);width:52px;text-align:center}
.lb td:last-child{border-right:2.5px solid var(--line);border-radius:0 14px 14px 0;text-align:right;font-family:var(--font-display)}
.lb tr.me td{background:#fff3c4}
.lb tr.r1 td:first-child{background:var(--sun)}
.score-big{font-family:var(--font-display);font-size:44px;color:var(--coral);-webkit-text-stroke:2px var(--line);paint-order:stroke fill}

/* 모달 */
#modal{position:fixed;inset:0;z-index:60;background:rgba(4,12,30,.66);display:none;align-items:center;justify-content:center;padding:18px}
#modal.on{display:flex}
#modal .panel{max-width:640px}
.notes{display:grid;gap:8px;margin-top:8px}
.note{background:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 3px 0 #d3e2f1;font-size:16px;line-height:1.5}
.note b{font-family:var(--font-display);font-weight:400;font-size:18px;color:#0a4f9c;margin-right:6px}
.note.miss{opacity:.5}
.stars{font-size:46px;color:#f0a500;letter-spacing:6px;text-shadow:0 3px 0 #c98400}
.stars .e{color:#cfd9e6;text-shadow:0 3px 0 #a9b6c6}
.gear{display:inline-flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 4px 0 #d3e2f1;font-family:var(--font-display);color:#12407a}
.gear .ic{font-size:40px;animation:hop .8s 2}

/* 미션 공통 요소 */
.bins{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-top:8px}
.bin{border:0;border-radius:22px;min-height:120px;padding:14px;font-family:var(--font-display);font-size:22px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.bin.a{background:linear-gradient(180deg,#ffb36b,#ff8a3d)}
.bin.b{background:linear-gradient(180deg,#6fc2ff,#3b8fe8)}
.bin small{display:block;font-family:var(--font-body);font-size:14px;opacity:.9;margin-top:4px}
.card{width:min(300px,42vw);min-height:150px;border-radius:22px;background:#fff;box-shadow:0 8px 0 #c6d6e8,0 14px 26px rgba(20,50,90,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;font-size:19px;line-height:1.45;text-align:center;animation:pop .3s}
.card .em{font-size:44px}
.card.no{animation:wob .4s}
.combo{font-family:var(--font-display);color:var(--coral);font-size:20px;min-height:28px;text-align:center}
.meter{height:16px;border-radius:999px;background:#dbe7f3;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.12)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#46e3c3,#2a8ee0);transition:width .3s;border-radius:999px}
.timer{font-family:var(--font-display);font-size:20px;color:#c43d1f;background:#ffe9e2;padding:3px 12px;border-radius:999px}

.mapwrap{position:relative;border-radius:18px;overflow:hidden;background:#123b6b}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center}
.pin i{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--bad);box-shadow:0 0 0 0 rgba(239,79,79,.7);animation:ping 1.4s infinite;display:block}
.pin span{font-family:var(--font-display);font-size:14px;background:#fff;color:var(--ink);padding:2px 8px;border-radius:999px;margin-top:6px;white-space:nowrap}
.pin.done i{background:var(--ok);animation:none}

.hunt{position:relative;border-radius:18px;overflow:hidden;height:300px;touch-action:none}
.hunt .obj{position:absolute;transform:translate(-50%,-50%);font-size:46px;border:0;background:none;padding:4px;line-height:1;transition:transform .15s}
.hunt .obj:hover{transform:translate(-50%,-50%) scale(1.12)}
.hunt .obj.found{filter:drop-shadow(0 0 10px #ff4b4b)}
.hunt .obj.found::after{content:"!";position:absolute;right:-4px;top:-6px;font-family:var(--font-display);font-size:18px;background:var(--bad);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.heat{position:absolute;inset:0;pointer-events:none;background:rgba(20,0,40,.18);-webkit-mask-image:radial-gradient(circle 80px at var(--x,50%) var(--y,50%),#000 97%,transparent 100%);mask-image:radial-gradient(circle 80px at var(--x,50%) var(--y,50%),#000 97%,transparent 100%)}
.heat.all{-webkit-mask-image:none;mask-image:none}
.heat b{position:absolute;transform:translate(-50%,-50%);width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(255,60,60,.85),rgba(255,120,60,.35) 50%,transparent 70%);animation:pulse 1s infinite}
.lens{position:absolute;width:160px;height:160px;border-radius:50%;border:5px solid #ffd25a;box-shadow:0 0 0 3px rgba(0,0,0,.25),inset 0 0 20px rgba(255,210,90,.4);transform:translate(-50%,-50%);pointer-events:none;left:var(--x,50%);top:var(--y,50%)}
.evid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.evid .e{background:#fff7d6;border:2px dashed #e0b400;border-radius:12px;padding:6px 10px;font-size:15px}

.scale svg{width:100%;max-height:300px;display:block}
.wcard{border:0;border-radius:16px;padding:10px 12px;background:#fff;box-shadow:0 4px 0 #c6d6e8;font-size:16px;display:flex;align-items:center;gap:8px;text-align:left}
.wcard .w{font-family:var(--font-display);background:#2a5fa8;color:#fff;border-radius:10px;padding:2px 8px;font-size:16px}
.wcard.used{opacity:.35}

.fall{position:absolute;transform:translateX(-50%);border:0;border-radius:16px;padding:10px 14px;font-size:17px;font-family:var(--font-display);background:#fff;color:var(--ink);box-shadow:0 5px 0 #b9cbe0,0 8px 16px rgba(0,0,0,.25);white-space:nowrap}
.fall.pop{animation:popout .3s forwards}

.poster{width:min(420px,80vw);aspect-ratio:3/4;margin:0 auto;border-radius:16px;background:linear-gradient(180deg,#bfe9ff,#ffffff);box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:20px;text-align:center;border:8px solid #fff}
.poster .pt{font-family:var(--font-display);font-size:32px;color:#12407a;line-height:1.2}
.poster .pe{font-size:110px}
.poster .pp{font-family:var(--font-display);font-size:22px;background:var(--coral);color:#fff;padding:8px 16px;border-radius:14px}

.cert{background:linear-gradient(180deg,#fffdf4,#fff6d8);border:6px double #e0b400;border-radius:22px;padding:22px;text-align:center;color:var(--ink)}
.cert h2{font-size:32px;color:#8a5a00;justify-content:center}
.cert .nm{font-family:var(--font-display);font-size:36px;color:#12407a;margin:8px 0}
.cert ul{text-align:left;display:inline-block;font-size:18px;line-height:1.7}

.sparkle{position:absolute;font-size:22px;pointer-events:none;animation:fly .8s ease-in forwards;z-index:70}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--sun);color:#4a3400;font-family:var(--font-display);font-size:18px;padding:8px 18px;border-radius:999px;z-index:80;animation:toast 1.8s forwards;box-shadow:0 6px 18px rgba(0,0,0,.3)}

@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes popout{to{transform:translateX(-50%) scale(1.4);opacity:0}}
@keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px) rotate(-3deg)}75%{transform:translateX(8px) rotate(3deg)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
@keyframes flash{from{opacity:1}to{opacity:0}}
@keyframes glint{0%,100%{box-shadow:0 0 0 rgba(255,210,90,0)}50%{box-shadow:0 0 12px rgba(255,190,40,.9)}}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes talk{0%{transform:translateY(0)}30%{transform:translateY(-6px) scale(1.03)}100%{transform:none}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.25)}}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes melt{to{transform:scaleY(.1) translateY(30px);opacity:0}}
@keyframes wave{to{transform:translateX(20px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes aur{from{transform:translateX(-8%) rotate(-4deg)}to{transform:translateX(8%) rotate(4deg)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(239,79,79,.7)}70%{box-shadow:0 0 0 16px rgba(239,79,79,0)}100%{box-shadow:0 0 0 0 rgba(239,79,79,0)}}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.15)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes rise{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes swim{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
@keyframes scatter{to{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:.9}}

@media (max-width:780px){

  .ice{width:66px;height:13px}.ice:nth-child(even){width:58px}

}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}

<body>
<script>
// ===== 캐릭터 SVG (만화풍: 굵은 갈색 외곽선, 반짝이는 큰 눈, 입체 그라데이션) =====
const OL = '#4a2a12';
let _u = 0;
function eye(cx, cy, s, iris, u, look) {
  s = s || 1; const id = 'ir' + u + '_' + Math.round(cx);
  const dx = look || 0;
  return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e120a"/><stop offset=".55" stop-color="${iris}"/><stop offset="1" stop-color="#e9b26a"/></linearGradient></defs>
  <ellipse cx="${cx}" cy="${cy}" rx="${12.5 * s}" ry="${16 * s}" fill="url(#${id})" stroke="${OL}" stroke-width="3"/>
  <ellipse cx="${cx + dx + 4 * s}" cy="${cy - 6 * s}" rx="${5 * s}" ry="${6 * s}" fill="#fff"/>
  <circle cx="${cx + dx - 4.5 * s}" cy="${cy + 6 * s}" r="${2.4 * s}" fill="#fff"/>
  <circle cx="${cx + dx + 6 * s}" cy="${cy + 4 * s}" r="${1.3 * s}" fill="#fff" opacity=".9"/>`;
}
function closedEye(cx, cy) { return `<path d="M${cx - 12} ${cy + 2} Q${cx} ${cy - 10} ${cx + 12} ${cy + 2}" fill="none" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`; }
function mouth(kind, x, y) {
  x = x || 100; y = y || 140;
  switch (kind) {
    case 'sad': return `<path d="M${x - 10} ${y + 4} Q${x} ${y - 5} ${x + 10} ${y + 4}" fill="none" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
    case 'o': return `<ellipse cx="${x}" cy="${y}" rx="7" ry="9" fill="#b8323f" stroke="${OL}" stroke-width="3"/>`;
    case 'smile': return `<path d="M${x - 11} ${y - 2} Q${x} ${y + 9} ${x + 11} ${y - 2}" fill="none" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
    case 'grin': return `<path d="M${x - 16} ${y - 4} Q${x} ${y + 20} ${x + 16} ${y - 4} Z" fill="#b8323f" stroke="${OL}" stroke-width="3.5" stroke-linejoin="round"/><path d="M${x - 9} ${y + 6} Q${x} ${y + 1} ${x + 9} ${y + 6} Q${x} ${y + 12} ${x - 9} ${y + 6}" fill="#ff8f9a"/><path d="M${x - 12} ${y - 3} L${x + 12} ${y - 3} L${x + 9} ${y + 1} L${x - 9} ${y + 1} Z" fill="#fff"/>`;
    default: return `<path d="M${x - 13} ${y - 4} Q${x} ${y + 16} ${x + 13} ${y - 4} Z" fill="#b8323f" stroke="${OL}" stroke-width="3.5" stroke-linejoin="round"/><path d="M${x - 7} ${y + 4} Q${x} ${y} ${x + 7} ${y + 4} Q${x} ${y + 9} ${x - 7} ${y + 4}" fill="#ff8f9a"/>`;
  }
}
function blush(x1, x2, y) { return `<ellipse cx="${x1}" cy="${y}" rx="11" ry="6.5" fill="#ff9aa8" opacity=".75"/><ellipse cx="${x2}" cy="${y}" rx="11" ry="6.5" fill="#ff9aa8" opacity=".75"/>`; }
function shadow() { return `<ellipse cx="100" cy="193" rx="58" ry="7" fill="rgba(74,42,18,.22)"/>`; }
function wrap(inner) { return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round">${inner}</svg>`; }

// 아기 북극곰 포리
function poriSVG(mood) {
  const u = ++_u; mood = mood || 'happy';
  const fur = `pf${u}`;
  let eyes = eye(72, 100, 1.05, '#5a3a22', u) + eye(128, 100, 1.05, '#5a3a22', u);
  if (mood === 'joy') eyes = closedEye(72, 100) + closedEye(128, 100);
  let brows = '';
  if (mood === 'sad' || mood === 'scared') brows = `<path d="M58 78 L82 84" stroke="${OL}" stroke-width="4" stroke-linecap="round"/><path d="M142 78 L118 84" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>`;
  const tear = mood === 'sad' ? `<path d="M56 112 Q50 124 56 128 Q62 124 56 112Z" fill="#7cc8ff" stroke="${OL}" stroke-width="2"/>` : '';
  const m = { happy: 'open', joy: 'open', sad: 'sad', scared: 'o' }[mood] || 'open';
  return wrap(`<defs><radialGradient id="${fur}" cx="40%" cy="32%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".65" stop-color="#f1f6fc"/><stop offset="1" stop-color="#cfdcec"/></radialGradient></defs>
  ${shadow()}
  <ellipse cx="100" cy="166" rx="52" ry="30" fill="url(#${fur})" stroke="${OL}" stroke-width="4"/>
  <ellipse cx="70" cy="182" rx="15" ry="10" fill="url(#${fur})" stroke="${OL}" stroke-width="4"/><ellipse cx="130" cy="182" rx="15" ry="10" fill="url(#${fur})" stroke="${OL}" stroke-width="4"/>
  <path d="M60 150 Q100 172 140 150 L136 162 Q100 180 64 162Z" fill="#ff6b4a" stroke="${OL}" stroke-width="3.5"/>
  <path d="M120 160 L132 186 L118 184Z" fill="#ff6b4a" stroke="${OL}" stroke-width="3"/>
  <circle cx="48" cy="50" r="21" fill="url(#${fur})" stroke="${OL}" stroke-width="4"/><circle cx="48" cy="52" r="10" fill="#ffc2cf"/>
  <circle cx="152" cy="50" r="21" fill="url(#${fur})" stroke="${OL}" stroke-width="4"/><circle cx="152" cy="52" r="10" fill="#ffc2cf"/>
  <ellipse cx="100" cy="98" rx="74" ry="62" fill="url(#${fur})" stroke="${OL}" stroke-width="4"/>
  <ellipse cx="100" cy="128" rx="28" ry="19" fill="#fffdf8" stroke="#c9b8a6" stroke-width="2"/>
  <path d="M90 116 Q100 110 110 116 Q106 126 100 127 Q94 126 90 116Z" fill="#2b1a10" stroke="${OL}" stroke-width="2"/>
  <ellipse cx="96" cy="116" rx="3.5" ry="2" fill="#fff"/>
  ${brows}${eyes}${blush(55, 145, 120)}${tear}${mouth(m, 100, 140)}`);
}

// 체온계 로봇 써모
function thermoSVG(mood) {
  const u = ++_u; const alert = mood === 'alert';
  const eyeC = alert ? '#ff5a5a' : '#5ff2ff';
  return wrap(`<defs>
  <linearGradient id="gl${u}" x1="0" x2="1"><stop offset="0" stop-color="#d9f1ff"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#a9d4f0"/></linearGradient>
  <radialGradient id="bl${u}" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#ffb3a6"/><stop offset=".5" stop-color="#f0503b"/><stop offset="1" stop-color="#b3261e"/></radialGradient>
  <linearGradient id="sc${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b4d78"/><stop offset="1" stop-color="#14263f"/></linearGradient></defs>
  ${shadow()}
  <path d="M62 112 Q38 118 36 134" fill="none" stroke="${OL}" stroke-width="5" stroke-linecap="round"/><circle cx="36" cy="138" r="9" fill="#ffd25a" stroke="${OL}" stroke-width="3.5"/>
  <path d="M138 112 Q164 104 168 88" fill="none" stroke="${OL}" stroke-width="5" stroke-linecap="round"/><circle cx="168" cy="84" r="9" fill="#ffd25a" stroke="${OL}" stroke-width="3.5"/>
  <line x1="100" y1="26" x2="100" y2="10" stroke="${OL}" stroke-width="4"/><circle cx="100" cy="9" r="8" fill="#ffd25a" stroke="${OL}" stroke-width="3.5"/>
  <rect x="62" y="24" width="76" height="132" rx="38" fill="url(#gl${u})" stroke="${OL}" stroke-width="4"/>
  <rect x="91" y="96" width="18" height="62" rx="9" fill="#f0503b" stroke="${OL}" stroke-width="2.5"/>
  <circle cx="100" cy="164" r="26" fill="url(#bl${u})" stroke="${OL}" stroke-width="4"/>
  <ellipse cx="91" cy="155" rx="7" ry="5" fill="#fff" opacity=".7"/>
  <rect x="72" y="40" width="56" height="44" rx="16" fill="url(#sc${u})" stroke="${OL}" stroke-width="3.5"/>
  <ellipse cx="89" cy="60" rx="7" ry="9" fill="${eyeC}"/><ellipse cx="111" cy="60" rx="7" ry="9" fill="${eyeC}"/>
  <circle cx="91" cy="56" r="2.5" fill="#fff"/><circle cx="113" cy="56" r="2.5" fill="#fff"/>
  <path d="M92 73 Q100 ${alert ? 69 : 78} 108 73" fill="none" stroke="${eyeC}" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="80" cy="76" rx="5" ry="3" fill="#ff9aa8" opacity=".7"/><ellipse cx="120" cy="76" rx="5" ry="3" fill="#ff9aa8" opacity=".7"/>
  <g stroke="${OL}" stroke-width="2.5" stroke-linecap="round"><line x1="118" y1="98" x2="126" y2="98"/><line x1="118" y1="110" x2="124" y2="110"/><line x1="118" y1="122" x2="126" y2="122"/><line x1="118" y1="134" x2="124" y2="134"/></g>
  <rect x="70" y="92" width="7" height="44" rx="3.5" fill="#fff" opacity=".8"/>`);
}

// 사람 공통 얼굴
function humanBase(o) {
  const u = ++_u;
  const skin = `sk${u}`, hair = `hr${u}`, suit = `su${u}`;
  const defs = `<defs>
  <radialGradient id="${skin}" cx="42%" cy="35%" r="70%"><stop offset="0" stop-color="#fff1e4"/><stop offset=".7" stop-color="#ffd9bf"/><stop offset="1" stop-color="#f3b994"/></radialGradient>
  <linearGradient id="${hair}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${o.hair2 || o.hair}"/><stop offset="1" stop-color="${o.hair}"/></linearGradient>
  <linearGradient id="${suit}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${o.suit2 || o.suit}"/><stop offset="1" stop-color="${o.suit}"/></linearGradient></defs>`;
  return { u, defs, skin: `url(#${skin})`, hair: `url(#${hair})`, suit: `url(#${suit})` };
}
function body(b, o) {
  return `<path d="M44 200 Q46 160 76 152 L124 152 Q154 160 156 200Z" fill="${b.suit}" stroke="${OL}" stroke-width="4"/>
  ${o.stripe ? `<path d="M52 186 L148 186" stroke="${o.stripe}" stroke-width="7"/>` : ''}
  <path d="M80 152 L100 172 L120 152" fill="${o.collar || '#fff'}" stroke="${OL}" stroke-width="3.5"/>
  ${o.badge ? `<path d="M128 168 l4 8 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1Z" fill="#ffd25a" stroke="${OL}" stroke-width="2.5"/>` : ''}`;
}
function faceCore(b, mood, opt) {
  opt = opt || {};
  const pal = { lash: !!opt.lash, c1: opt.c1 || '#7a3e1c', c2: opt.c2 || '#ffcf7a' };
  return animeFace(b.u, mood || 'happy', 78, 122, pal.c1, pal.c2, pal.lash, opt.ey || 108);
}

// 단비 대장
function danbiSVG(mood) {
  const o = { hair: '#3b2214', hair2: '#6b3e22', suit: '#1f3f73', suit2: '#2f5ea6', stripe: '#ff8a3d', collar: '#ffd25a', badge: 1 };
  const b = humanBase(o);
  return wrap(b.defs + shadow() + body(b, o) + `
  <path d="M150 70 Q186 92 172 140 Q162 120 150 112Z" fill="${b.hair}" stroke="${OL}" stroke-width="4"/>
  <ellipse cx="100" cy="92" rx="66" ry="64" fill="${b.hair}" stroke="${OL}" stroke-width="4"/>
  <ellipse cx="100" cy="108" rx="54" ry="50" fill="${b.skin}" stroke="${OL}" stroke-width="4"/>
  <path d="M44 96 Q48 40 100 36 Q152 40 156 96 Q140 70 112 68 Q118 80 108 86 Q100 66 76 70 Q60 76 44 96Z" fill="${b.hair}" stroke="${OL}" stroke-width="4"/>
  <path d="M40 98 Q36 46 100 30 Q164 46 160 98" fill="none" stroke="#ff7a59" stroke-width="7" stroke-linecap="round"/>
  <circle cx="42" cy="104" r="13" fill="#ff7a59" stroke="${OL}" stroke-width="3.5"/>
  <path d="M46 114 Q58 140 82 138" fill="none" stroke="${OL}" stroke-width="3.5" stroke-linecap="round"/><circle cx="84" cy="138" r="4.5" fill="#333" stroke="${OL}" stroke-width="2"/>
  ` + faceCore(b, mood || 'smile', { lash: true, c1: '#6b2f12', c2: '#ffb36b', ey: 106, brow: `<path d="M66 86 L88 83" stroke="${OL}" stroke-width="4" stroke-linecap="round"/><path d="M134 86 L112 83" stroke="${OL}" stroke-width="4" stroke-linecap="round"/>` }));
}

// 루카 선배
function lukaSVG(mood) {
  const o = { hair: '#b8541a', hair2: '#f08a3a', suit: '#138a78', suit2: '#24c2a5', stripe: '#ffe14d', collar: '#fff' };
  const b = humanBase(o);
  return wrap(b.defs + shadow() + body(b, o) + `
  <ellipse cx="100" cy="110" rx="54" ry="50" fill="${b.skin}" stroke="${OL}" stroke-width="4"/>
  <path d="M42 96 L48 54 L62 66 L70 34 L86 56 L100 26 L112 54 L130 34 L136 62 L154 52 L158 96 Q140 72 100 74 Q62 72 42 96Z" fill="${b.hair}" stroke="${OL}" stroke-width="4"/>
  <rect x="50" y="66" width="100" height="10" rx="5" fill="#3a3a48" stroke="${OL}" stroke-width="3"/>
  <circle cx="80" cy="68" r="15" fill="#9fe3ff" stroke="${OL}" stroke-width="4"/><circle cx="120" cy="68" r="15" fill="#9fe3ff" stroke="${OL}" stroke-width="4"/>
  <ellipse cx="75" cy="63" rx="5" ry="3.5" fill="#fff"/><ellipse cx="115" cy="63" rx="5" ry="3.5" fill="#fff"/>
  <rect x="124" y="124" width="18" height="9" rx="3" fill="#ffe0b3" stroke="${OL}" stroke-width="2.5" transform="rotate(-20 133 128)"/>
  ` + faceCore(b, mood || 'grin', { c1: '#1d7a5a', c2: '#8ff0c8', ey: 110 }));
}

// 주민 등 조연
function npcSVG(o) {
  o = Object.assign({ hair: '#4a3020', suit: '#6aa3d8', hat: null, mood: 'happy', old: false }, o || {});
  if (o.kind === 'squirrel') return squirrelSVG();
  const b = humanBase(o);
  const hat = o.hat ? `<path d="M48 82 Q50 40 100 38 Q150 40 152 82Z" fill="${o.hat}" stroke="${OL}" stroke-width="4"/><path d="M40 84 L160 84" stroke="${OL}" stroke-width="9" stroke-linecap="round"/><path d="M40 84 L160 84" stroke="${o.hat}" stroke-width="4" stroke-linecap="round"/>` : '';
  const hair = o.old ? `<path d="M48 104 Q42 52 100 50 Q158 52 152 104 Q146 80 128 74 Q100 84 72 74 Q54 80 48 104Z" fill="#e6e6ea" stroke="${OL}" stroke-width="4"/><circle cx="100" cy="46" r="16" fill="#e6e6ea" stroke="${OL}" stroke-width="4"/>`
    : `<path d="M48 104 Q42 52 100 48 Q158 52 152 104 Q140 76 100 74 Q62 76 48 104Z" fill="${b.hair}" stroke="${OL}" stroke-width="4"/>`;
  const glasses = o.old ? `<circle cx="78" cy="110" r="15" fill="none" stroke="${OL}" stroke-width="3"/><circle cx="122" cy="110" r="15" fill="none" stroke="${OL}" stroke-width="3"/><path d="M93 110h14" stroke="${OL}" stroke-width="3"/>` : '';
  return wrap(b.defs + shadow() + body(b, o) + `<ellipse cx="100" cy="112" rx="52" ry="48" fill="${b.skin}" stroke="${OL}" stroke-width="4"/>${hair}${hat}` + faceCore(b, o.mood, { ey: 110 }) + glasses);
}
function squirrelSVG() {
  const u = ++_u;
  return wrap(`<defs><radialGradient id="sq${u}" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#e7a46a"/><stop offset="1" stop-color="#b8692e"/></radialGradient></defs>${shadow()}
  <path d="M150 190 Q196 150 168 90 Q150 60 170 40 Q130 50 140 100 Q150 140 120 170Z" fill="url(#sq${u})" stroke="${OL}" stroke-width="4"/>
  <ellipse cx="100" cy="166" rx="40" ry="28" fill="url(#sq${u})" stroke="${OL}" stroke-width="4"/>
  <path d="M58 64 L64 30 L84 56Z" fill="url(#sq${u})" stroke="${OL}" stroke-width="4"/><path d="M142 64 L136 30 L116 56Z" fill="url(#sq${u})" stroke="${OL}" stroke-width="4"/>
  <ellipse cx="100" cy="104" rx="56" ry="50" fill="url(#sq${u})" stroke="${OL}" stroke-width="4"/>
  <ellipse cx="100" cy="126" rx="28" ry="20" fill="#fff1dc"/>
  ${eye(78, 100, .9, '#3a2216', u)}${eye(122, 100, .9, '#3a2216', u)}
  <ellipse cx="100" cy="118" rx="6" ry="4.5" fill="#2b1a10"/>${blush(62, 138, 120)}${mouth('sad', 100, 134)}`);
}
function shadowSVG() {
  return wrap(`<ellipse cx="100" cy="193" rx="50" ry="7" fill="rgba(0,0,0,.25)"/>
  <path d="M40 190 Q30 100 60 60 Q100 10 140 60 Q170 100 160 190 Q140 175 125 190 Q110 175 100 190 Q90 175 75 190 Q60 175 40 190Z" fill="#2d2240" stroke="#120b1c" stroke-width="4"/>
  <ellipse cx="80" cy="92" rx="9" ry="12" fill="#ff5a5a"/><ellipse cx="120" cy="92" rx="9" ry="12" fill="#ff5a5a"/>
  <text x="100" y="150" text-anchor="middle" font-size="44" fill="#ffe14d" font-family="Jua">?</text>`);
}

const PEOPLE = {
  pori: { name: '포리', svg: m => poriSVG(m), bg: '#dff3ff' },
  thermo: { name: '써모', svg: m => thermoSVG(m), bg: '#e0f7ff' },
  danbi: { name: '단비 대장', svg: m => danbiSVG(m), bg: '#ffe7d6' },
  luka: { name: '루카', svg: m => lukaSVG(m), bg: '#d9fbef' },
  me: { name: '{name}', svg: m => heroSVG(m, G.avatar), bg: '#fff3c4' },
  friend: { name: '친구', svg: m => heroSVG(m, 'c', false), bg: '#ece6ff' },
  shadow: { name: '???', svg: () => shadowSVG(), bg: '#3a2c4f' },
  factory: { name: '공장장', svg: () => npcSVG({ hat: '#ffd23f', suit: '#5a7da8', hair: '#3a2a20' }), bg: '#e8eef6' },
  squirrel: { name: '다람쥐', svg: () => squirrelSVG(), bg: '#e9f8d9' },
  police: { name: '교통경찰', svg: () => npcSVG({ hat: '#2a4f8c', suit: '#2a4f8c', suit2: '#4a7cc4', collar: '#ffe14d' }), bg: '#e3ecfb' },
  grandma: { name: '이웃 할머니', svg: () => npcSVG({ old: true, suit: '#d77fa1', suit2: '#f2a6c2' }), bg: '#ffe9f2' },
  janitor: { name: '미화원 아저씨', svg: () => npcSVG({ hat: '#2fbf71', suit: '#2fa36a', suit2: '#55cf8f', hair: '#2b2b2b' }), bg: '#e2f7ea' },
  villager: { name: '마을 주민', svg: m => npcSVG({ mood: m || 'sad', suit: '#d98a4a', suit2: '#f2ad6f' }), bg: '#fff0de' },
  rep: { name: '대표', svg: m => npcSVG({ suit: '#7a5ac8', suit2: '#a589f0' }), bg: '#f0eaff' },
  narr: { name: '', svg: () => '', bg: 'transparent' }

async function clueCheck(list) {
  let miss = list.filter(k => !G.clues[k]);
  if (!miss.length) return;
  await new Promise(res => {
    const draw = () => {
      miss = list.filter(k => !G.clues[k]);
      const items = list.map(k => {
        const s = G.seen[k] || ''; const got = !!G.clues[k];
        const html = s ? s.replace(k, `<button type="button" class="kw ${got ? 'got' : ''}" data-k="${k}">${k}</button>`) : k;
        return `<div class="note ${got ? '' : ''}">${html}</div>`;
      }).join('');
      $('#modal').innerHTML = `<div class="panel"><h2>단서 점검 <span class="tag">${list.length - miss.length} / ${list.length}</span></h2>
        <p class="guide">${miss.length ? `아직 저장하지 않은 단서가 ${miss.length}개 있어요. 문장을 다시 읽고 반짝이는 단어를 눌러 모두 저장하면 확인 퀴즈가 열려요.` : '단서를 모두 모았어요! 확인 퀴즈를 시작해요.'}</p>
        <div class="notes">${items}</div>
        <div class="row center" style="margin-top:14px"><button class="big" type="button" id="goQuiz" ${miss.length ? 'disabled' : ''}>확인 퀴즈 시작</button></div></div>`;
      $('#modal').classList.add('on');
      $('#modal').querySelectorAll('.kw').forEach(b => b.onclick = () => { collect(b.dataset.k, G.seen[b.dataset.k], b); draw(); });
      $('#goQuiz').onclick = () => { closeModal(); res(); };
    };
    draw();
  });
}

}

function panel(tag, title, guide, wide) {
  const p = document.createElement('div'); p.className = 'panel'; if (wide) p.style.maxWidth = wide + 'px';
  p.innerHTML = `<h2>${tag ? `<span class="tag">${tag}</span>` : ''}${title}</h2>${guide ? `<p class="guide">${guide}</p>` : ''}<div class="body"></div>`;
  $('#layer').appendChild(p); return p.querySelector('.body');
}
function doneBtn(body, label) { return new Promise(r => { const b = document.createElement('div'); b.className = 'row center'; b.style.marginTop = '14px'; b.innerHTML = `<button class="big" type="button">${label || '다음'}</button>`; body.appendChild(b); b.firstChild.onclick = () => { sfx.tick(); r(); }; }); }

MISSIONS.sort = o => new Promise(res => {
  const body = panel(o.tag, o.title, o.guide);
  let queue = shuffle(o.cards), left = queue.length;
  body.innerHTML = `<div class="meter"><i></i></div><div class="combo"></div>
   <div class="bins"><button class="bin a" type="button" data-b="0">${o.bins[0]}<small>← 왼쪽</small></button><div class="slot"></div><button class="bin b" type="button" data-b="1">${o.bins[1]}<small>오른쪽 →</small></button></div>`;
  const total = queue.length;
  const draw = () => {
    $('.meter i', body).style.width = ((total - left) / total * 100) + '%';
    if (!queue.length) { document.removeEventListener('keydown', key); setTimeout(res, 500); return; }
    const c = queue[0]; $('.slot', body).innerHTML = `<div class="card">${c.em ? `<div class="em">${c.em}</div>` : ''}<div>${c.text}</div></div>`;
  };
  const pick = b => {
    const c = queue[0]; if (!c) return;
    if (c.bin === b) { right(); queue.shift(); left--; $('.combo', body).textContent = G.combo >= 2 ? `${G.combo}연속 정답!` : ''; if (o.ok) react(...o.ok); draw(); }
    else { wrong(); $('.slot .card', body).classList.add('no'); $('.combo', body).textContent = ''; if (o.no) react(...(typeof o.no === 'function' ? o.no(c) : o.no)); queue.push(queue.shift()); setTimeout(draw, 450); }
  };
  body.querySelectorAll('.bin').forEach(b => b.onclick = () => pick(+b.dataset.b));
  const key = e => { if (e.key === 'ArrowLeft') pick(0); if (e.key === 'ArrowRight') pick(1); };
  document.addEventListener('keydown', key);
  draw();
});

// 탄소 저울 퍼즐
MISSIONS.scale = async o => {

      const body = panel(`미션 3-1 · ${ri + 1}라운드`, '탄소 저울 퍼즐', '카드를 눌러 저울을 수평으로 맞추세요. 카드마다 어느 접시에 영향을 줄지 먼저 생각해 보세요!', 860);
      let L = rd.L, R = rd.R; const used = new Set(); let t = rd.time || 0, tick = null;
      const draw = () => {
        const diff = L - R, ang = Math.max(-18, Math.min(18, diff * 1.6));
        const rad = ang * Math.PI / 180, cx = 350, cy = 90, arm = 210;
        const lx = cx - arm * Math.cos(rad), ly = cy + arm * Math.sin(rad), rx = cx + arm * Math.cos(rad), ry = cy - arm * Math.sin(rad);
        const pan = (x, y, val, col, lab, icon) => `<line x1="${x}" y1="${y}" x2="${x - 50}" y2="${y + 70}" stroke="${OLB}" stroke-width="3"/><line x1="${x}" y1="${y}" x2="${x + 50}" y2="${y + 70}" stroke="${OLB}" stroke-width="3"/>

          <text x="${x}" y="${y + 60}" text-anchor="middle" font-size="26">${icon.repeat(Math.min(5, Math.ceil(val / 4)))}</text>

        $('#sc', body).innerHTML = `<svg viewBox="0 0 700 330" width="100%"><path d="M310 250 L350 100 L390 250Z" fill="#ffd23f" stroke="${OLB}" stroke-width="5"/>
          <line x1="${lx}" y1="${ly}" x2="${rx}" y2="${ry}" stroke="${OLB}" stroke-width="12" stroke-linecap="round"/><line x1="${lx}" y1="${ly}" x2="${rx}" y2="${ry}" stroke="#a8743e" stroke-width="6" stroke-linecap="round"/>
          <circle cx="${cx}" cy="${cy}" r="12" fill="#f2735a" stroke="${OLB}" stroke-width="4"/>
          ${pan(lx, ly, L, '#c8c3cf', '내보내는 양', '☁️')}${pan(rx, ry, R, '#b9ecc4', '흡수하는 양', '🌿')}</svg>`;
        $('#st', body).textContent = diff === 0 ? '수평! 탄소 중립 달성!' : diff > 0 ? `내보내는 쪽이 ${diff}만큼 더 무거워요` : `흡수하는 쪽이 ${-diff}만큼 더 무거워요`;
        if (diff === 0) { clearInterval(tick); sfx.win(); addBlock(2); G.pts += 200; react('thermo', '삐빅! 수평 달성! 더 이상 이산화 탄소가 쌓이지 않아.'); body.querySelectorAll('.wcard').forEach(b => b.disabled = true); doneBtn(body, ri < o.rounds.length - 1 ? '다음 라운드' : '저울 퍼즐 완료!').then(res); }
      };
      body.innerHTML = `<div class="row" style="justify-content:space-between"><span id="st" style="font-family:Jua;font-size:19px;color:#c43d1f"></span>${t ? `<span class="timer" id="tm">${t}초</span>` : ''}</div>
        <div class="scale" id="sc"></div>
        <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px">${shuffle(rd.cards).map((c, i) => `<button class="wcard" type="button" data-c='${JSON.stringify(c)}'><span class="w">${c.v}</span>${c.t}</button>`).join('')}</div>
        <div class="row center" style="margin-top:10px"><button class="big ghost" type="button" id="rs">처음부터 다시</button></div>`;
      body.querySelectorAll('.wcard').forEach(b => b.onclick = () => {
        if (b.classList.contains('used')) return; const c = JSON.parse(b.dataset.c); b.classList.add('used'); b.disabled = true;

        else if (c.k === 'sink') { R += c.v; sfx.ok(); react('thermo', `삐빅! ${c.t}: 흡수하는 이산화 탄소가 ${c.v}만큼 늘었어.`); }
        else { L += c.v; wrong(); react('luka', `으악, ${c.t}는 작전 2에서 찾은 범인 행동이잖아! 내보내는 쪽이 더 무거워졌어. "처음부터 다시"를 눌러 봐.`); }
        draw();
      });
      $('#rs', body).onclick = () => { L = rd.L; R = rd.R; body.querySelectorAll('.wcard').forEach(b => { b.classList.remove('used'); b.disabled = false; }); sfx.tick(); draw(); };

      draw();
    });

  }
};

function poster(body, res) {

    body.innerHTML = `<div class="grid2" style="align-items:start"><div>

    const upd = () => { $('#pv .pt', body).textContent = $('#pT', body).value || '빙하를 지켜 주세요!'; };
    $('#pT', body).oninput = upd; upd();

      S('pori', '대원님, 다음에 또 놀러 와요! 그때는 얼음이 더 두껍고 단단했으면 좋겠어요.', 'joy'),
      S('luka', '나도 오토바이 대신 자전거 탈 거야. 일주일 뒤에 누가 더 잘 지켰는지 대결하자!', 'grin'),
      S('danbi', '{name} 대원, 앞으로. 북극곰 구조대장으로서 너를 정식 대원으로 임명한다!', 'smile'),
      F(async () => { flash(); sfx.win(); hideDlg(); }),
      M('ceremony')
    ]
  }
];

// 원인 연결 고리 순서 맞추기
MISSIONS.chain = () => new Promise(res => {
  const steps = ['인간의 활동이 늘어나요', '온실가스(이산화 탄소 등)가 많이 나와요', '지구 온난화가 일어나요', '기후변화 현상이 심해져요'];
  const em = ['🏭', '☁️', '🌡️', '🌪️'];
  const body = panel('미션 2-2+', '연결 고리 맞추기', '카드를 일어나는 순서대로 눌러 연결 고리를 완성하세요.', 860);
  let next = 0;
  body.innerHTML = `<div class="row center" id="slots" style="gap:6px;margin-bottom:14px">${steps.map((s, i) => `<div class="note" style="min-width:150px;min-height:70px;text-align:center;border:3px dashed #c9b29a;flex:1" data-i="${i}">${i + 1}</div>${i < 3 ? '<b style="font-size:26px">→</b>' : ''}`).join('')}</div>
    <div class="grid2">${shuffle(steps.map((s, i) => ({ s, i }))).map(x => `<button class="opt" type="button" data-i="${x.i}" style="text-align:center"><span style="font-size:28px">${em[x.i]}</span><br>${x.s}</button>`).join('')}</div>`;
  react('thermo', '삐빅! 무엇이 먼저 일어나는지 생각해 봐.');
  body.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (i === next) {
      right(); b.disabled = true; b.classList.add('ok');
      const slot = body.querySelector(`#slots [data-i="${i}"]`); slot.innerHTML = `<span style="font-size:26px">${em[i]}</span><br>${steps[i]}`; slot.style.borderStyle = 'solid'; slot.style.background = '#d4f7e3';
      next++;
      if (next === 4) { react('danbi', '완벽해! 인간의 활동 → 온실가스 → 지구 온난화 → 기후변화. 이게 빙하를 녹인 연결 고리야.', 'smile'); doneBtn(body, '연결 고리 완성!').then(res); }
    } else { wrong(); b.classList.add('no'); setTimeout(() => b.classList.remove('no'), 450); react('luka', '음, 그건 조금 더 나중에 일어나는 일 같아!'); }
  });
});

// ===== 시작 =====
window.addEventListener('DOMContentLoaded', () => {
  load(); buildUI(); setBg('arctic'); renderPips(); showTitle();
});

</script>
</body>
